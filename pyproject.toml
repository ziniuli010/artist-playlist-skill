[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-playlist"
version = "1.1.0"
description = "把一个歌手的全部专辑曲目按发行时间整理成独立歌单文件（Markdown / CSV / 可导入清单）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "artist-playlist contributors" }]
keywords = ["playlist", "discography", "music", "album", "qqmusic", "netease", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
artist-playlist = "artist_playlist:main"

[project.urls]
Homepage = "https://github.com/ziniuli010/artist-playlist-skill"
Issues = "https://github.com/ziniuli010/artist-playlist-skill/issues"

[tool.setuptools]
py-modules = ["artist_playlist"]
packages = ["scripts", "scripts.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# 只开语法错误与未定义名，避免风格规则把贡献者挡在门外
select = ["E9", "F"]
ignore = ["F401"]
